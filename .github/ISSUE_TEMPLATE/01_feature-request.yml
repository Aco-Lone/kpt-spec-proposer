name: 機能要望 (Feature Request)
description: プロトタイプ作成の起点となる、シンプルな要望を記入してください
title: "[要望] "
labels: ["feature-request"]
body:
  - type: input
    id: feature-name
    attributes:
      label: 機能名（feature-name）
      description: |
        成果物ディレクトリ docs/specs/<feature-name>/ に使う識別子。
        形式: 半角小文字英数字とハイフンのみ（正規表現 ^[a-z0-9]+(?:-[a-z0-9]+)*$）。
        使用可能: color-theme-setting
        使用不可: ColorTheme、color_theme、color--theme、../color-theme
        不正な識別子はagentが処理を中断します（自動補正はしません）。
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: やりたいこと
      description: 実現したいことを簡潔に記述してください
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜこれが必要か、どんな状況で困っているか
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: 除外してよい範囲
      description: 今回のプロトタイプでは対応しなくてよい範囲があれば記述してください
    validations:
      required: false
