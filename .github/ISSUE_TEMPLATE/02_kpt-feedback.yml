name: KPTフィードバック
description: スプレッドシートで管理したKPTのCSVを取り込むためのIssueです
title: "[KPT] "
labels: ["kpt-feedback"]
body:
  - type: input
    id: feature-name
    attributes:
      label: 機能名（feature-name）
      description: 対象の要望Issueで指定した feature-name（docs/specs/<feature-name>/ に対応）
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 対象プロトタイプ
      description: 対象のIssue番号またはPRリンク
    validations:
      required: true
  - type: input
    id: csv-path
    attributes:
      label: KPT CSV のパス
      description: スプレッドシートから書き出し、コミットしたCSVのパス（例 docs/specs/<feature-name>/kpt-log/round2.csv）。カラムは 種別,機能カテゴリ,内容,状態。IDはagentが集約時に付与するため不要。
    validations:
      required: true
  - type: textarea
    id: kpt-csv
    attributes:
      label: KPT CSV（任意・貼り付け）
      description: CSVをコミットする代わりに、ここに直接貼り付けても取り込めます。1行目はヘッダ（種別,機能カテゴリ,内容,状態）。
    validations:
      required: false
